services:
  shazam-node:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      API_KEY: "${API_KEY:?Set API_KEY before starting}"
      MAX_AUDIO_MB: "30"
      MAX_CONCURRENT: "2"
      ENABLE_REMOTE_URLS: "false"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=96m
    security_opt:
      - no-new-privileges:true
